version: "3.9"
services:

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA}
    volumes:
      - postgresqldata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - metric_network
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - metric_network
    volumes:
      - redisdata:/data

  demo-api:
    container_name: etalon-project
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    command: bash -c 'cd src/ && uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level debug'

volumes:
  postgresqldata:
  redisdata:

networks:
  metric_network:
    driver: bridge
    name: metric_network
